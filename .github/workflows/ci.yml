name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: 后端 · Lint + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: Ruff Lint
        run: python -m ruff check backend
      - name: Pytest（覆盖率）
        working-directory: backend
        run: python -m pytest tests/ -q --cov=services --cov=routers --cov=database --cov=main --cov=logging_setup --cov-report=term-missing

  frontend:
    name: 前端 · 测试 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: Vitest
        working-directory: frontend
        run: npm test
      - name: 构建
        working-directory: frontend
        run: npm run build
