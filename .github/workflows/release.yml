name: Release

# 推送 v* 标签 → 构建 Windows 桌面包并发布到 GitHub Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop-windows:
    name: 桌面版 · Windows 打包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装后端依赖 + PyInstaller
        run: pip install -r backend/requirements.txt pyinstaller

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: PyInstaller 打包
        working-directory: backend
        run: python -m PyInstaller weave.spec --noconfirm

      - name: 打包 zip
        shell: pwsh
        run: Compress-Archive -Path "backend/dist/织识/*" -DestinationPath "weave-windows-x64.zip"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: weave-windows-x64.zip
          generate_release_notes: true
