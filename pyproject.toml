[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "backend/build", "backend/dist", "backend/storage", ".rivet"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/run.py", "backend/build/*"]
